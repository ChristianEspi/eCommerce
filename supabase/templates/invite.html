<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Te dieron acceso</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f5;font-family:'DM Sans',Arial,Helvetica,sans-serif;color:#1c2421;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;border:1px solid #e2e8e5;">
            <tr>
              <td style="padding:32px 32px 8px 32px;">
                <h1 style="margin:0 0 16px 0;font-size:20px;line-height:1.3;color:#1c2421;">Te dieron acceso</h1>
                <p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;">
                  Te invitaron a entrar con <strong>{{ .Email }}</strong>. Pulsa el botón para
                  aceptar la invitación y elegir tu contraseña.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 24px 32px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#056769;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:8px;">
                  Aceptar la invitación
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px 32px;">
                <p style="margin:0 0 12px 0;font-size:13px;line-height:1.6;color:#55615c;">
                  Si no esperabas esta invitación, ignora este correo.
                </p>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#55615c;word-break:break-all;">
                  Si el botón no funciona, copia esta dirección en el navegador:<br />
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
